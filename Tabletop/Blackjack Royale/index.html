<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blackjack Royale</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
  </head>

  <body>
    <a href="../../index.html" class="back-link">&lt; Back to Pixel Palace</a>
    <div class="game-wrapper">
        <h1>BLACKJACK ROYALE</h1>
        <div class="container">
            <h1>Blackjack Royale</h1>
            <h3><span id="blackjack-result">Let's Play </span></h3>

      <div class="flex-blackjack-row-2">
        <div id="your-box">
          <h2>You: <span id="your-blackjack-result"> 0</span></h2>
        </div>

        <div id="dealer-box">
          <h2>Dealer: <span id="dealer-blackjack-result"> 0</span></h2>
        </div>
      </div>

      <div class="flex-blackjack-row-3">
        <div>
          <button class="btn-lg btn-primary mr-2" id="blackjack-hit-button">
            Hit
          </button>
          <button class="btn-lg btn-warning mr-2" id="blackjack-stand-button">
            Stand
          </button>
          <button class="btn-lg btn-danger mr-2" id="blackjack-deal-button">
            Deal
          </button>
          <button class="btn-lg btn-success mr-2" id="blackjack-reset-button">
            Restart
          </button>
        </div>
      </div>
      <div class="flex-blackjack-row-1">
        <table>
          <tr>
            <th id="win-header">Win</th>
            <th id="loss-header">Lose</th>
            <th id="draw-header">Draw</th>
          </tr>

          <tr>
            <td><span id="wins">0</span></td>
            <td><span id="losses">0</span></td>
            <td><span id="draws">0</span></td>
          </tr>
        </table>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
