<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tic-Tac Duel</title>
    <link rel="stylesheet" href="style.css">
    <script src="./script.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
    <a href="../../index.html" class="back-link">&lt; Back to Pixel Palace</a>
    <div class="game-wrapper">
        <h1>AI TIC-TAC DUEL</h1>
        <div class="selector">
        <select name="" id="player_x">
            <option value="human" selected="selected">Human</option>
            <option value="bot">Bot</option>
        </select>
        vs
        <select name="" id="player_o">
            <option value="human">Human</option>
            <option value="bot" selected="selected">Bot</option>
        </select>
    </div>
    <p class = "result"></p>
    <div class="board">
        <div class="row">
            <div class="cell playable" ></div>
            <div class="cell playable"></div>
            <div class="cell playable"></div>
        </div>
        <div class="row">
            <div class="cell playable"></div>
            <div class="cell playable"></div>
            <div class="cell playable"></div>
        </div>
        <div class="row">
            <div class="cell playable"></div>
            <div class="cell playable"></div>
            <div class="cell playable"></div>
        </div>
    </div>
    <button class="reset">RESET</button>
</body>
</html>
