<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bug-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b19"/>
      <stop offset="100%" stop-color="#143b2f"/>
    </linearGradient>
    <filter id="bug-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#bug-bg)"/>
  
  <!-- Moon & Night Sky Stars -->
  <circle cx="500" cy="80" r="40" fill="#ffff88" opacity="0.8" filter="url(#bug-glow)"/>
  <circle cx="100" cy="60" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="220" cy="90" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="380" cy="50" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Grass Blades -->
  <path d="M 0 350 Q 50 280 100 400 Q 150 290 200 400 Q 250 260 300 400 Q 380 270 450 400 Q 520 280 600 400 Z" fill="#00ff66" opacity="0.2"/>

  <!-- Bug Collector Jar -->
  <rect x="230" y="160" width="140" height="180" rx="20" fill="rgba(0, 255, 255, 0.15)" stroke="#00ffff" stroke-width="4" filter="url(#bug-glow)"/>
  <rect x="250" y="140" width="100" height="20" rx="6" fill="#ff00ff"/>

  <!-- Glowing Bugs Inside & Around Jar -->
  <!-- Beetle 1 (Neon Green) -->
  <ellipse cx="280" cy="240" rx="18" ry="24" fill="#00ff66" filter="url(#bug-glow)"/>
  <circle cx="280" cy="220" r="10" fill="#00ffff"/>
  <line x1="272" y1="212" x2="260" y2="198" stroke="#00ff66" stroke-width="3"/>
  <line x1="288" y1="212" x2="300" y2="198" stroke="#00ff66" stroke-width="3"/>

  <!-- Beetle 2 (Neon Yellow) -->
  <ellipse cx="320" cy="270" rx="14" ry="20" fill="#ffff00" filter="url(#bug-glow)"/>
  <circle cx="320" cy="254" r="8" fill="#ff00ff"/>

  <!-- Firefly Floating Outside Jar (Cyan) -->
  <circle cx="160" cy="180" r="14" fill="#00ffff" filter="url(#bug-glow)"/>
  <path d="M 140 180 Q 160 160 180 180" stroke="#00ffff" stroke-width="2" fill="none"/>

  <!-- Firefly Floating Outside Jar (Magenta) -->
  <circle cx="440" cy="210" r="16" fill="#ff00ff" filter="url(#bug-glow)"/>

  <!-- Title Text -->
  <text x="300" y="70" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="20" fill="#00ff66" text-anchor="middle" filter="url(#bug-glow)">BUG COLLECTOR</text>
</svg>
