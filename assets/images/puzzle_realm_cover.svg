<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0820"/>
      <stop offset="100%" stop-color="#0d1a30"/>
    </linearGradient>
    <filter id="pr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#pr-bg)"/>
  <!-- 4x4 sliding puzzle grid centered -->
  <g transform="translate(175, 90)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="65" height="65" rx="8" fill="#6622bb" stroke="#cc66ff" stroke-width="2"/>
    <text x="32" y="42" font-family="monospace" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="75" y="0" width="65" height="65" rx="8" fill="#6622bb" stroke="#cc66ff" stroke-width="2"/>
    <text x="107" y="42" font-family="monospace" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="150" y="0" width="65" height="65" rx="8" fill="#6622bb" stroke="#cc66ff" stroke-width="2"/>
    <text x="182" y="42" font-family="monospace" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">3</text>
    <!-- Empty slot -->
    <rect x="225" y="0" width="65" height="65" rx="8" fill="#110820" stroke="#440088" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Row 2 -->
    <rect x="0" y="75" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="32" y="117" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">5</text>
    <rect x="75" y="75" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="107" y="117" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">6</text>
    <rect x="150" y="75" width="65" height="65" rx="8" fill="#8833ff" stroke="#ffcc00" stroke-width="2" filter="url(#pr-glow)"/>
    <text x="182" y="117" font-family="monospace" font-weight="bold" font-size="28" fill="#ffcc00" text-anchor="middle">4</text>
    <rect x="225" y="75" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="257" y="117" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">7</text>
    <!-- Row 3 -->
    <rect x="0" y="150" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="32" y="192" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">9</text>
    <rect x="75" y="150" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="107" y="192" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">10</text>
    <rect x="150" y="150" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="182" y="192" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">11</text>
    <rect x="225" y="150" width="65" height="65" rx="8" fill="#3311aa" stroke="#cc66ff" stroke-width="2"/>
    <text x="257" y="192" font-family="monospace" font-weight="bold" font-size="28" fill="#ccccff" text-anchor="middle">8</text>
  </g>
  <!-- Arrow showing slide direction -->
  <polygon points="225,155 245,145 245,165" fill="#ffcc00" filter="url(#pr-glow)"/>
  <!-- Title -->
  <text x="300" y="50" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="18" fill="#cc66ff" text-anchor="middle" filter="url(#pr-glow)">PUZZLE REALM</text>
</svg>
