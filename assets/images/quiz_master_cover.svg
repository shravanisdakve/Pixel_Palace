<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="quiz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120e29"/>
      <stop offset="100%" stop-color="#2d1b54"/>
    </linearGradient>
    <filter id="quiz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#quiz-bg)"/>

  <!-- Question Marks in Background -->
  <text x="100" y="140" font-family="'Press Start 2P', sans-serif" font-size="60" fill="#ff00ff" opacity="0.2">?</text>
  <text x="460" y="160" font-family="'Press Start 2P', sans-serif" font-size="70" fill="#00ffff" opacity="0.2">?</text>
  <text x="480" y="330" font-family="'Press Start 2P', sans-serif" font-size="50" fill="#ffff00" opacity="0.2">?</text>
  <text x="80" y="320" font-family="'Press Start 2P', sans-serif" font-size="55" fill="#00ff66" opacity="0.2">?</text>

  <!-- Central Glowing Quiz Lightbulb / Trophy Badge -->
  <g transform="translate(300, 200)" filter="url(#quiz-glow)">
    <!-- Lightbulb Base & Glass -->
    <path d="M -40 -30 A 50 50 0 1 1 40 -30 C 30 0 20 20 20 40 L -20 40 C -20 20 -30 0 -40 -30 Z" fill="#ffff00"/>
    <rect x="-18" y="44" width="36" height="12" rx="3" fill="#00ffff"/>
    <rect x="-12" y="60" width="24" height="8" rx="2" fill="#ff00ff"/>
    
    <!-- Light Rays -->
    <line x1="0" y1="-95" x2="0" y2="-115" stroke="#ffff00" stroke-width="6" stroke-linecap="round"/>
    <line x1="-70" y1="-70" x2="-85" y2="-85" stroke="#ffff00" stroke-width="6" stroke-linecap="round"/>
    <line x1="70" y1="-70" x2="85" y2="-85" stroke="#ffff00" stroke-width="6" stroke-linecap="round"/>
    <line x1="-95" y1="-20" x2="-115" y2="-20" stroke="#ffff00" stroke-width="6" stroke-linecap="round"/>
    <line x1="95" y1="-20" x2="115" y2="-20" stroke="#ffff00" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Big Question Mark in Center of Bulb -->
    <text x="0" y="0" font-family="'Press Start 2P', sans-serif" font-weight="900" font-size="42" fill="#120e29" text-anchor="middle">?</text>
  </g>

  <!-- Title Text -->
  <text x="300" y="55" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="20" fill="#ffff00" text-anchor="middle" filter="url(#quiz-glow)">QUIZ MASTER</text>
</svg>
