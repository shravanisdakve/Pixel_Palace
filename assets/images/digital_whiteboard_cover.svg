<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="canvas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#0a0d17"/>
    </linearGradient>
    <linearGradient id="pen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#ff00ff"/>
    </linearGradient>
    <filter id="brush-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#canvas-bg)"/>

  <!-- Canvas Dot Pattern Grid -->
  <g fill="rgba(255, 255, 255, 0.15)">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/><circle cx="400" cy="100" r="2"/><circle cx="500" cy="100" r="2"/><circle cx="600" cy="100" r="2"/><circle cx="700" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="500" cy="200" r="2"/><circle cx="600" cy="200" r="2"/><circle cx="700" cy="200" r="2"/>
    <circle cx="100" cy="300" r="2"/><circle cx="200" cy="300" r="2"/><circle cx="300" cy="300" r="2"/><circle cx="400" cy="300" r="2"/><circle cx="500" cy="300" r="2"/><circle cx="600" cy="300" r="2"/><circle cx="700" cy="300" r="2"/>
  </g>

  <!-- Dynamic Glowing Brush Strokes -->
  <path d="M 120 220 Q 250 80, 400 200 T 680 150" fill="none" stroke="#ff00ff" stroke-width="8" stroke-linecap="round" filter="url(#brush-glow)"/>
  <path d="M 160 300 C 280 180, 480 360, 640 240" fill="none" stroke="#00ffff" stroke-width="6" stroke-linecap="round" filter="url(#brush-glow)"/>
  <path d="M 300 130 Q 420 320, 520 120" fill="none" stroke="#ffff00" stroke-width="5" stroke-linecap="round" filter="url(#brush-glow)"/>

  <!-- Glowing Stylus Pen Tool -->
  <g transform="translate(560, 100) rotate(-35)" filter="url(#brush-glow)">
    <rect x="0" y="0" width="16" height="120" rx="8" fill="url(#pen-grad)"/>
    <polygon points="0,120 16,120 8,140" fill="#ffffff"/>
    <circle cx="8" cy="140" r="3" fill="#00ffff"/>
  </g>

  <!-- Floating Palette Color Badges -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="rgba(15, 20, 35, 0.9)" stroke="rgba(255, 255, 255, 0.2)"/>
    <circle cx="25" cy="20" r="10" fill="#ff00ff"/>
    <circle cx="55" cy="20" r="10" fill="#00ffff"/>
    <circle cx="85" cy="20" r="10" fill="#ffff00"/>
    <circle cx="115" cy="20" r="10" fill="#00ff66"/>
  </g>

  <!-- Title Badge -->
  <rect x="220" y="365" width="360" height="46" rx="23" fill="rgba(10, 15, 30, 0.95)" stroke="#ff00ff" stroke-width="2"/>
  <text x="400" y="394" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">DIGITAL WHITEBOARD CANVAS</text>
</svg>
