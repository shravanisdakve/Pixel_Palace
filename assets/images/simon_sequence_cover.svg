<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a0a20"/>
    </linearGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#ss-bg)"/>
  <!-- 4 Simon buttons in a circle layout -->
  <!-- Green (top-left) - LIT -->
  <path d="M 220 100 L 280 100 Q 300 200 220 200 Z" rx="12" fill="#00cc44" filter="url(#ss-glow)"/>
  <!-- Red (top-right) - unlit -->
  <path d="M 320 100 L 380 100 Q 380 200 300 200 Z" fill="#440011"/>
  <!-- Blue (bottom-left) - LIT -->
  <path d="M 220 220 Q 220 300 300 300 L 300 220 Z" fill="#0044cc" filter="url(#ss-glow)"/>
  <!-- Yellow (bottom-right) - unlit -->
  <path d="M 300 220 L 300 300 Q 380 300 380 220 Z" fill="#443300"/>
  <!-- Center circle -->
  <circle cx="300" cy="200" r="30" fill="#1a0a20" stroke="#444444" stroke-width="3"/>
  <!-- Memory sequence dots above -->
  <circle cx="210" cy="65" r="12" fill="#00cc44" filter="url(#ss-glow)"/>
  <circle cx="250" cy="65" r="12" fill="#cc0022" opacity="0.5"/>
  <circle cx="290" cy="65" r="12" fill="#0044cc" filter="url(#ss-glow)"/>
  <circle cx="330" cy="65" r="12" fill="#ccaa00" opacity="0.5"/>
  <circle cx="370" cy="65" r="12" fill="#00cc44" filter="url(#ss-glow)"/>
  <!-- Title -->
  <text x="300" y="355" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="13" fill="#00ff88" text-anchor="middle" filter="url(#ss-glow)">SIMON SEQUENCE</text>
  <text x="300" y="380" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="13" fill="#ffdd00" text-anchor="middle" filter="url(#ss-glow)">CHALLENGE</text>
</svg>
