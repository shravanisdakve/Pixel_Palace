<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    
    <linearGradient id="cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Shield Badge -->
  <rect x="20" y="20" width="460" height="460" rx="40" fill="url(#logo-bg)" stroke="#00ffff" stroke-width="6" filter="url(#logo-glow)"/>

  <!-- Inner Cyber Grid -->
  <g stroke="rgba(0, 255, 255, 0.15)" stroke-width="2">
    <line x1="50" y1="150" x2="450" y2="150"/>
    <line x1="50" y1="250" x2="450" y2="250"/>
    <line x1="50" y1="350" x2="450" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="450"/>
    <line x1="250" y1="50" x2="250" y2="450"/>
    <line x1="350" y1="50" x2="350" y2="450"/>
  </g>

  <!-- Pixel Castle / Palace Crown -->
  <!-- Central Tower -->
  <rect x="210" y="110" width="80" height="40" fill="#ff00ff" filter="url(#logo-glow)"/>
  <rect x="230" y="90" width="40" height="20" fill="#ffff00"/>

  <!-- Left Turret -->
  <rect x="110" y="150" width="60" height="40" fill="#00ffff" filter="url(#logo-glow)"/>
  <rect x="110" y="130" width="20" height="20" fill="#00ffff"/>
  <rect x="150" y="130" width="20" height="20" fill="#00ffff"/>

  <!-- Right Turret -->
  <rect x="330" y="150" width="60" height="40" fill="#00ffff" filter="url(#logo-glow)"/>
  <rect x="330" y="130" width="20" height="20" fill="#00ffff"/>
  <rect x="370" y="130" width="20" height="20" fill="#00ffff"/>

  <!-- Palace Main Body -->
  <rect x="90" y="190" width="320" height="130" rx="8" fill="url(#cyan-pink)" filter="url(#logo-glow)"/>

  <!-- Controller D-Pad on Left -->
  <rect x="130" y="240" width="20" height="60" fill="#0f0f1e" rx="4"/>
  <rect x="110" y="260" width="60" height="20" fill="#0f0f1e" rx="4"/>

  <!-- Action Buttons on Right -->
  <circle cx="330" cy="250" r="12" fill="#ff00ff"/>
  <circle cx="360" cy="275" r="12" fill="#00ffff"/>
  <circle cx="330" cy="290" r="12" fill="#ffff00"/>
  <circle cx="300" cy="275" r="12" fill="#00ff66"/>

  <!-- Archway Doorway -->
  <path d="M 210 320 A 40 40 0 0 1 290 320 V 320 H 210 Z" fill="#0f0f1e"/>

  <!-- Typography -->
  <text x="250" y="390" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="28" fill="#00ffff" text-anchor="middle" filter="url(#logo-glow)">PIXEL</text>
  <text x="250" y="428" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="24" fill="#ff00ff" text-anchor="middle" filter="url(#logo-glow)">PALACE</text>
</svg>
