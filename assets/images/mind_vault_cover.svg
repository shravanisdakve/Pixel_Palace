<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#150d30"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="brain-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a38"/>
      <stop offset="100%" stop-color="#0d0d22"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad)"/>
  
  <!-- Cyber Grid -->
  <g stroke="rgba(0, 255, 255, 0.08)" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Glowing Memory Vault Cards -->
  <g transform="translate(180, 110)">
    <!-- Card 1 (Matched Glow) -->
    <rect x="0" y="0" width="130" height="180" rx="12" fill="url(#card-grad)" stroke="#ff00ff" stroke-width="3" filter="url(#glow)"/>
    <circle cx="65" cy="90" r="30" fill="none" stroke="#ff00ff" stroke-width="3"/>
    <path d="M50 90 L60 100 L80 80" fill="none" stroke="#ff00ff" stroke-width="4" stroke-linecap="round"/>

    <!-- Card 2 (Neon Question) -->
    <rect x="150" y="0" width="130" height="180" rx="12" fill="url(#card-grad)" stroke="#00ffff" stroke-width="2"/>
    <text x="215" y="110" font-family="'Press Start 2P', sans-serif" font-size="48" fill="#00ffff" text-anchor="middle" filter="url(#glow)">?</text>

    <!-- Card 3 (Matched Cyber Chip) -->
    <rect x="300" y="0" width="130" height="180" rx="12" fill="url(#card-grad)" stroke="#ffff00" stroke-width="3" filter="url(#glow)"/>
    <polygon points="365,65 390,105 340,105" fill="none" stroke="#ffff00" stroke-width="3"/>

    <!-- Card 4 (Neon Question) -->
    <rect x="450" y="0" width="130" height="180" rx="12" fill="url(#card-grad)" stroke="#00ffff" stroke-width="2"/>
    <text x="515" y="110" font-family="'Press Start 2P', sans-serif" font-size="48" fill="#00ffff" text-anchor="middle" filter="url(#glow)">?</text>
  </g>

  <!-- Title Badge -->
  <rect x="220" y="340" width="360" height="50" rx="25" fill="rgba(15, 15, 30, 0.9)" stroke="url(#brain-glow)" stroke-width="2"/>
  <text x="400" y="372" font-family="sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="3">MIND VAULT MEMORY</text>
</svg>
