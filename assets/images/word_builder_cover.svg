<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#200a20"/>
    </linearGradient>
    <filter id="wb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#wb-bg)"/>
  <!-- Letter tiles to arrange into word -->
  <!-- Available letters scattered at top -->
  <rect x="55" y="70" width="60" height="60" rx="8" fill="#1a0a3a" stroke="#ff44cc" stroke-width="2" filter="url(#wb-glow)"/>
  <text x="85" y="110" font-family="monospace" font-weight="bold" font-size="32" fill="#ff44cc" text-anchor="middle" filter="url(#wb-glow)">B</text>
  <rect x="130" y="70" width="60" height="60" rx="8" fill="#1a0a3a" stroke="#aa44ff" stroke-width="2" filter="url(#wb-glow)"/>
  <text x="160" y="110" font-family="monospace" font-weight="bold" font-size="32" fill="#aa44ff" text-anchor="middle" filter="url(#wb-glow)">U</text>
  <rect x="205" y="70" width="60" height="60" rx="8" fill="#1a0a3a" stroke="#ff44cc" stroke-width="2" filter="url(#wb-glow)"/>
  <text x="235" y="110" font-family="monospace" font-weight="bold" font-size="32" fill="#ff44cc" text-anchor="middle" filter="url(#wb-glow)">I</text>
  <rect x="280" y="70" width="60" height="60" rx="8" fill="#1a0a3a" stroke="#aa44ff" stroke-width="2" filter="url(#wb-glow)"/>
  <text x="310" y="110" font-family="monospace" font-weight="bold" font-size="32" fill="#aa44ff" text-anchor="middle" filter="url(#wb-glow)">L</text>
  <rect x="355" y="70" width="60" height="60" rx="8" fill="#1a0a3a" stroke="#ff44cc" stroke-width="2" filter="url(#wb-glow)"/>
  <text x="385" y="110" font-family="monospace" font-weight="bold" font-size="32" fill="#ff44cc" text-anchor="middle" filter="url(#wb-glow)">D</text>
  <!-- Formed word below -->
  <rect x="80" y="185" width="440" height="65" rx="12" fill="#0a0028" stroke="#ffcc00" stroke-width="3" filter="url(#wb-glow)"/>
  <text x="300" y="228" font-family="monospace" font-weight="bold" font-size="36" fill="#ffcc00" text-anchor="middle" letter-spacing="14" filter="url(#wb-glow)">BUILD</text>
  <!-- Word score -->
  <text x="300" y="305" font-family="monospace" font-weight="bold" font-size="22" fill="#00ffcc" text-anchor="middle" filter="url(#wb-glow)">+5 LETTERS = 50 PTS!</text>
  <!-- Vocab hint -->
  <text x="300" y="350" font-family="monospace" font-size="14" fill="#884499" text-anchor="middle">construct · create · form</text>
  <!-- Title -->
  <text x="300" y="48" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="16" fill="#ff44cc" text-anchor="middle" filter="url(#wb-glow)">WORD BUILDER</text>
</svg>
