<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#grid-bg)"/>

  <!-- Glowing Grid Lines -->
  <g stroke="#00ffff" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)">
    <line x1="320" y1="70" x2="320" y2="330"/>
    <line x1="480" y1="70" x2="480" y2="330"/>
    <line x1="180" y1="150" x2="620" y2="150"/>
    <line x1="180" y1="250" x2="620" y2="250"/>
  </g>

  <!-- Glowing X Marks (Magenta) -->
  <!-- Top Left X -->
  <g stroke="#ff00ff" stroke-width="12" stroke-linecap="round" filter="url(#neon-glow)">
    <line x1="220" y1="90" x2="280" y2="130"/>
    <line x1="280" y1="90" x2="220" y2="130"/>
  </g>

  <!-- Center X (Winning) -->
  <g stroke="#ff00ff" stroke-width="14" stroke-linecap="round" filter="url(#neon-glow)">
    <line x1="370" y1="170" x2="430" y2="230"/>
    <line x1="430" y1="170" x2="370" y2="230"/>
  </g>

  <!-- Bottom Right X -->
  <g stroke="#ff00ff" stroke-width="12" stroke-linecap="round" filter="url(#neon-glow)">
    <line x1="520" y1="270" x2="580" y2="310"/>
    <line x1="580" y1="270" x2="520" y2="310"/>
  </g>

  <!-- Glowing O Marks (Cyan) -->
  <!-- Top Center O -->
  <circle cx="400" cy="110" r="28" fill="none" stroke="#00ffff" stroke-width="10" filter="url(#neon-glow)"/>

  <!-- Middle Left O -->
  <circle cx="250" cy="200" r="28" fill="none" stroke="#00ffff" stroke-width="10" filter="url(#neon-glow)"/>

  <!-- Winning Strike Through Line -->
  <line x1="200" y1="80" x2="600" y2="320" stroke="#ffff00" stroke-width="8" stroke-linecap="round" filter="url(#neon-glow)"/>

  <!-- Title Badge -->
  <rect x="240" y="370" width="320" height="46" rx="23" fill="rgba(10, 15, 30, 0.95)" stroke="#00ffff" stroke-width="2"/>
  <text x="400" y="399" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">TIC-TAC-TOE CLASSIC</text>
</svg>
