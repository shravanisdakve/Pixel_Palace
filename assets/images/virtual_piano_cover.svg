<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="piano-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140726"/>
      <stop offset="100%" stop-color="#3b0f5c"/>
    </linearGradient>
    <filter id="piano-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#piano-bg)"/>

  <!-- Musical Notes Glowing in Sky -->
  <text x="120" y="100" font-family="sans-serif" font-size="48" fill="#ff00ff" filter="url(#piano-glow)">♪</text>
  <text x="440" y="110" font-family="sans-serif" font-size="56" fill="#00ffff" filter="url(#piano-glow)">♫</text>
  <text x="280" y="90" font-family="sans-serif" font-size="42" fill="#ffff00" filter="url(#piano-glow)">♩</text>

  <!-- Piano Keyboard Frame -->
  <g transform="translate(80, 160)" filter="url(#piano-glow)">
    <!-- White Keys -->
    <rect x="0" y="0" width="50" height="180" rx="6" fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="55" y="0" width="50" height="180" rx="6" fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="110" y="0" width="50" height="180" rx="6" fill="#00ffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="165" y="0" width="50" height="180" rx="6" fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="220" y="0" width="50" height="180" rx="6" fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="275" y="0" width="50" height="180" rx="6" fill="#ff00ff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="330" y="0" width="50" height="180" rx="6" fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>
    <rect x="385" y="0" width="50" height="180" rx="6" fill="#ffffff" stroke="#0f0f1e" stroke-width="3"/>

    <!-- Black Keys -->
    <rect x="35" y="0" width="30" height="110" rx="4" fill="#0f0f1e"/>
    <rect x="90" y="0" width="30" height="110" rx="4" fill="#0f0f1e"/>
    <rect x="200" y="0" width="30" height="110" rx="4" fill="#0f0f1e"/>
    <rect x="255" y="0" width="30" height="110" rx="4" fill="#0f0f1e"/>
    <rect x="310" y="0" width="30" height="110" rx="4" fill="#0f0f1e"/>
  </g>

  <!-- Title Text -->
  <text x="300" y="55" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="20" fill="#ff00ff" text-anchor="middle" filter="url(#piano-glow)">VIRTUAL PIANO</text>
</svg>
