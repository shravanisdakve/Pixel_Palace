<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="script-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f24"/>
      <stop offset="100%" stop-color="#45123d"/>
    </linearGradient>
    <filter id="script-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#script-bg)"/>

  <!-- Magic Open Spellbook -->
  <path d="M 120 280 C 180 250 280 250 300 270 C 320 250 420 250 480 280 L 480 180 C 420 150 320 150 300 170 C 280 150 180 150 120 180 Z" fill="#0f0f1e" stroke="#ff00ff" stroke-width="4" filter="url(#script-glow)"/>

  <!-- Code Script Lines Glowing on Left Page -->
  <line x1="160" y1="200" x2="260" y2="200" stroke="#00ffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="220" x2="240" y2="220" stroke="#00ff66" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="240" x2="270" y2="240" stroke="#ffff00" stroke-width="4" stroke-linecap="round"/>

  <!-- Glowing Sword Rising from Center of Book -->
  <path d="M 300 80 L 312 180 L 300 190 L 288 180 Z" fill="#00ffff" stroke="#ffffff" stroke-width="2" filter="url(#script-glow)"/>
  <!-- Hilt & Crossguard -->
  <rect x="270" y="190" width="60" height="12" rx="4" fill="#ffff00"/>
  <circle cx="300" cy="215" r="10" fill="#ff00ff"/>

  <!-- Title Text -->
  <text x="300" y="55" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="20" fill="#ff00ff" text-anchor="middle" filter="url(#script-glow)">SCRIPTED ADVENTURES</text>
</svg>
