<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="race-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0f2b"/>
      <stop offset="100%" stop-color="#3d154d"/>
    </linearGradient>
    <filter id="race-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#race-bg)"/>

  <!-- Speed Motion Lines -->
  <line x1="50" y1="120" x2="350" y2="120" stroke="#ff00ff" stroke-width="4" stroke-dasharray="20,10" opacity="0.6"/>
  <line x1="20" y1="200" x2="420" y2="200" stroke="#00ffff" stroke-width="6" stroke-dasharray="30,15" opacity="0.8"/>
  <line x1="80" y1="280" x2="480" y2="280" stroke="#ffff00" stroke-width="5" stroke-dasharray="25,12" opacity="0.7"/>

  <!-- Checkered Finish Line Banner -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="20" height="20" fill="#ffffff"/>
    <rect x="20" y="0" width="20" height="20" fill="#000000"/>
    <rect x="0" y="20" width="20" height="20" fill="#000000"/>
    <rect x="20" y="20" width="20" height="20" fill="#ffffff"/>
    <rect x="0" y="40" width="20" height="20" fill="#ffffff"/>
    <rect x="20" y="40" width="20" height="20" fill="#000000"/>
    <rect x="0" y="60" width="20" height="20" fill="#000000"/>
    <rect x="20" y="60" width="20" height="20" fill="#ffffff"/>
    <rect x="0" y="80" width="20" height="20" fill="#ffffff"/>
    <rect x="20" y="80" width="20" height="20" fill="#000000"/>
  </g>

  <!-- Fast Racing Hare Silhouette (Cyan & Pink Glow) -->
  <g transform="translate(200, 140)" filter="url(#race-glow)">
    <!-- Rabbit Body -->
    <ellipse cx="140" cy="90" rx="55" ry="32" fill="#00ffff"/>
    <!-- Rabbit Head -->
    <circle cx="205" cy="65" r="26" fill="#00ffff"/>
    <!-- Long Ears Backwards in Speed -->
    <path d="M 195 45 Q 120 10 90 25 Q 130 45 190 52 Z" fill="#ff00ff"/>
    <path d="M 205 45 Q 140 0 110 15 Q 150 38 200 48 Z" fill="#ffff00"/>
    <!-- Racing Eye -->
    <ellipse cx="218" cy="60" rx="5" ry="7" fill="#ff00ff"/>
    <!-- Fast Legs Motion -->
    <path d="M 100 110 Q 60 140 40 160" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 170 110 Q 220 150 250 170" stroke="#00ffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="300" y="65" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="20" fill="#ff00ff" text-anchor="middle" filter="url(#race-glow)">HARE SPEED CHASE</text>
</svg>
