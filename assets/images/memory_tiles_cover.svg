<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1a"/>
      <stop offset="100%" stop-color="#0a0520"/>
    </linearGradient>
    <filter id="mt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#mt-bg)"/>
  <!-- 4x3 card grid -->
  <!-- Row 1 -->
  <rect x="60" y="80" width="100" height="80" rx="10" fill="#1a0a3a" stroke="#cc44ff" stroke-width="2" filter="url(#mt-glow)"/>
  <text x="110" y="128" font-family="monospace" font-size="32" fill="#cc44ff" text-anchor="middle" filter="url(#mt-glow)">🐱</text>
  <rect x="175" y="80" width="100" height="80" rx="10" fill="#0a1a3a" stroke="#00ccff" stroke-width="2"/>
  <text x="225" y="128" font-family="monospace" font-size="30" fill="#00ccff" text-anchor="middle">?</text>
  <rect x="290" y="80" width="100" height="80" rx="10" fill="#1a0a3a" stroke="#cc44ff" stroke-width="2" filter="url(#mt-glow)"/>
  <text x="340" y="128" font-family="monospace" font-size="32" fill="#cc44ff" text-anchor="middle" filter="url(#mt-glow)">🐱</text>
  <rect x="405" y="80" width="100" height="80" rx="10" fill="#0a1a3a" stroke="#00ccff" stroke-width="2"/>
  <text x="455" y="128" font-family="monospace" font-size="30" fill="#00ccff" text-anchor="middle">?</text>
  <!-- Row 2 -->
  <rect x="60" y="175" width="100" height="80" rx="10" fill="#0a1a3a" stroke="#00ccff" stroke-width="2"/>
  <text x="110" y="223" font-family="monospace" font-size="30" fill="#00ccff" text-anchor="middle">?</text>
  <rect x="175" y="175" width="100" height="80" rx="10" fill="#1a2a0a" stroke="#88ff44" stroke-width="2" filter="url(#mt-glow)"/>
  <text x="225" y="223" font-family="monospace" font-size="32" fill="#88ff44" text-anchor="middle" filter="url(#mt-glow)">⭐</text>
  <rect x="290" y="175" width="100" height="80" rx="10" fill="#0a1a3a" stroke="#00ccff" stroke-width="2"/>
  <text x="340" y="223" font-family="monospace" font-size="30" fill="#00ccff" text-anchor="middle">?</text>
  <rect x="405" y="175" width="100" height="80" rx="10" fill="#1a2a0a" stroke="#88ff44" stroke-width="2" filter="url(#mt-glow)"/>
  <text x="455" y="223" font-family="monospace" font-size="32" fill="#88ff44" text-anchor="middle" filter="url(#mt-glow)">⭐</text>
  <!-- Matched pair highlight -->
  <rect x="57" y="77" width="106" height="86" rx="12" fill="none" stroke="#ffcc00" stroke-width="3" stroke-dasharray="6,3" filter="url(#mt-glow)"/>
  <rect x="287" y="77" width="106" height="86" rx="12" fill="none" stroke="#ffcc00" stroke-width="3" stroke-dasharray="6,3" filter="url(#mt-glow)"/>
  <!-- Title -->
  <text x="300" y="50" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="16" fill="#cc44ff" text-anchor="middle" filter="url(#mt-glow)">MEMORY TILES</text>
  <!-- Match label -->
  <text x="300" y="350" font-family="monospace" font-weight="bold" font-size="16" fill="#ffcc00" text-anchor="middle" filter="url(#mt-glow)">MATCH! +100 pts</text>
</svg>
