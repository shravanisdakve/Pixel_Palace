<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="chess-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c122c"/>
      <stop offset="100%" stop-color="#182c54"/>
    </linearGradient>
    <filter id="chess-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#chess-bg)"/>

  <!-- Perspective Chessboard -->
  <g opacity="0.3" stroke="#00ffff" stroke-width="2">
    <line x1="100" y1="350" x2="200" y2="200"/>
    <line x1="230" y1="350" x2="260" y2="200"/>
    <line x1="370" y1="350" x2="340" y2="200"/>
    <line x1="500" y1="350" x2="400" y2="200"/>
    
    <line x1="120" y1="320" x2="480" y2="320"/>
    <line x1="160" y1="270" x2="440" y2="270"/>
    <line x1="200" y1="220" x2="400" y2="220"/>
  </g>

  <!-- King Chess Piece (Neon Cyan) -->
  <g transform="translate(230, 110)" filter="url(#chess-glow)">
    <!-- Cross on Top -->
    <rect x="35" y="10" width="10" height="30" fill="#00ffff"/>
    <rect x="25" y="20" width="30" height="10" fill="#00ffff"/>
    <!-- Crown Body -->
    <path d="M 15 50 Q 40 35 65 50 L 60 110 L 20 110 Z" fill="#00ffff"/>
    <!-- Base -->
    <rect x="10" y="110" width="60" height="25" rx="6" fill="#ffffff"/>
  </g>

  <!-- Knight Chess Piece (Neon Pink) -->
  <g transform="translate(320, 120)" filter="url(#chess-glow)">
    <!-- Horse Head Silhouette -->
    <path d="M 20 100 Q 10 50 40 30 Q 70 30 65 60 Q 55 70 65 80 L 60 100 Z" fill="#ff00ff"/>
    <!-- Eye -->
    <circle cx="45" cy="45" r="5" fill="#ffff00"/>
    <!-- Base -->
    <rect x="10" y="100" width="60" height="25" rx="6" fill="#ffffff"/>
  </g>

  <!-- Title Text -->
  <text x="300" y="55" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="20" fill="#00ffff" text-anchor="middle" filter="url(#chess-glow)">CHESS ARENA</text>
</svg>
