<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0510"/>
      <stop offset="100%" stop-color="#15051a"/>
    </linearGradient>
    <filter id="bt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bt-bg)"/>
  <!-- Brain outline (simplified) -->
  <ellipse cx="300" cy="190" rx="130" ry="110" fill="none" stroke="#ff44ff" stroke-width="3" filter="url(#bt-glow)" opacity="0.5"/>
  <ellipse cx="290" cy="185" rx="100" ry="85" fill="#1a0522" stroke="#ff44ff" stroke-width="2" filter="url(#bt-glow)"/>
  <!-- Brain folds (wavy lines) -->
  <path d="M 220 170 Q 250 150 280 170 Q 310 190 340 170 Q 360 155 370 170" fill="none" stroke="#ff88ff" stroke-width="2.5" filter="url(#bt-glow)"/>
  <path d="M 210 200 Q 240 182 270 200 Q 300 218 330 200 Q 355 185 375 200" fill="none" stroke="#ff88ff" stroke-width="2.5" filter="url(#bt-glow)"/>
  <path d="M 225 230 Q 255 215 285 230 Q 315 245 340 230" fill="none" stroke="#ff88ff" stroke-width="2.5" filter="url(#bt-glow)"/>
  <!-- Lightbulb idea flash above brain -->
  <polygon points="300,70 315,100 330,90 310,120 300,110 290,120 270,90 285,100" fill="#ffdd00" filter="url(#bt-glow)"/>
  <rect x="288" y="118" width="24" height="6" rx="3" fill="#ffdd00"/>
  <rect x="288" y="128" width="24" height="6" rx="3" fill="#ffdd00"/>
  <!-- Gears on sides (logic) -->
  <circle cx="135" cy="200" r="30" fill="none" stroke="#00ccff" stroke-width="3" filter="url(#bt-glow)"/>
  <circle cx="135" cy="200" r="18" fill="#00224a" stroke="#00ccff" stroke-width="2"/>
  <text x="135" y="207" font-family="monospace" font-weight="bold" font-size="16" fill="#00ccff" text-anchor="middle">⚙</text>
  <circle cx="465" cy="200" r="30" fill="none" stroke="#ff8800" stroke-width="3" filter="url(#bt-glow)"/>
  <circle cx="465" cy="200" r="18" fill="#2a1000" stroke="#ff8800" stroke-width="2"/>
  <text x="465" y="207" font-family="monospace" font-weight="bold" font-size="16" fill="#ff8800" text-anchor="middle">⚙</text>
  <!-- Title -->
  <text x="300" y="45" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="14" fill="#ff44ff" text-anchor="middle" filter="url(#bt-glow)">BRAIN TEASER</text>
  <text x="300" y="73" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="14" fill="#ffdd00" text-anchor="middle" filter="url(#bt-glow)">HUB</text>
  <!-- Bottom tagline -->
  <text x="300" y="370" font-family="monospace" font-size="15" fill="#ff44ff" text-anchor="middle" filter="url(#bt-glow)">THINK. SOLVE. WIN.</text>
</svg>
