<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1000"/>
      <stop offset="100%" stop-color="#1a1a00"/>
    </linearGradient>
    <filter id="sb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#sb-bg)"/>
  <!-- Big bee emoji centered -->
  <text x="300" y="190" font-family="monospace" font-size="110" text-anchor="middle" filter="url(#sb-glow)">🐝</text>
  <!-- Sound wave arcs (audio cue) -->
  <path d="M 380 100 Q 420 140 380 180" fill="none" stroke="#ffdd00" stroke-width="4" stroke-linecap="round" filter="url(#sb-glow)"/>
  <path d="M 400 80 Q 455 140 400 200" fill="none" stroke="#ffdd00" stroke-width="3" stroke-linecap="round" filter="url(#sb-glow)" opacity="0.7"/>
  <path d="M 420 60 Q 490 140 420 220" fill="none" stroke="#ffdd00" stroke-width="2" stroke-linecap="round" filter="url(#sb-glow)" opacity="0.4"/>
  <!-- Spelling slots below bee -->
  <rect x="75" y="240" width="450" height="52" rx="10" fill="#001000" stroke="#ffdd00" stroke-width="2" filter="url(#sb-glow)"/>
  <text x="300" y="274" font-family="monospace" font-weight="bold" font-size="28" fill="#ffdd00" text-anchor="middle" letter-spacing="14" filter="url(#sb-glow)">S P E L L</text>
  <!-- Listen label -->
  <rect x="200" y="310" width="200" height="36" rx="10" fill="#111000" stroke="#ffdd00" stroke-width="2"/>
  <text x="300" y="333" font-family="monospace" font-size="16" fill="#ffdd00" text-anchor="middle">🔊 LISTEN &amp; TYPE</text>
  <!-- Title -->
  <text x="300" y="48" font-family="'Press Start 2P', monospace, sans-serif" font-weight="900" font-size="18" fill="#ffdd00" text-anchor="middle" filter="url(#sb-glow)">SPELLING BEE</text>
</svg>
