<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#faf0ca"/>
  <!-- Warm Terracotta & Cream 2048 Grid -->
  <g transform="translate(220, 50)">
    <rect x="0" y="0" width="360" height="340" rx="16" fill="#bbada0"/>
    <!-- Tiles -->
    <rect x="15" y="15" width="70" height="70" rx="8" fill="#eee4da"/>
    <text x="50" y="60" font-family="sans-serif" font-weight="bold" font-size="28" fill="#776e65" text-anchor="middle">2</text>

    <rect x="100" y="15" width="70" height="70" rx="8" fill="#ede0c8"/>
    <text x="135" y="60" font-family="sans-serif" font-weight="bold" font-size="28" fill="#776e65" text-anchor="middle">4</text>

    <rect x="185" y="15" width="70" height="70" rx="8" fill="#f2b179"/>
    <text x="220" y="60" font-family="sans-serif" font-weight="bold" font-size="28" fill="#f9f6f2" text-anchor="middle">8</text>

    <rect x="270" y="15" width="70" height="70" rx="8" fill="#f59563"/>
    <text x="305" y="60" font-family="sans-serif" font-weight="bold" font-size="26" fill="#f9f6f2" text-anchor="middle">16</text>

    <!-- Row 2 -->
    <rect x="15" y="95" width="70" height="70" rx="8" fill="#f67c5f"/>
    <text x="50" y="140" font-family="sans-serif" font-weight="bold" font-size="26" fill="#f9f6f2" text-anchor="middle">32</text>

    <rect x="100" y="95" width="70" height="70" rx="8" fill="#f65e3b"/>
    <text x="135" y="140" font-family="sans-serif" font-weight="bold" font-size="26" fill="#f9f6f2" text-anchor="middle">64</text>

    <rect x="185" y="95" width="70" height="70" rx="8" fill="#edcf72"/>
    <text x="220" y="140" font-family="sans-serif" font-weight="bold" font-size="24" fill="#f9f6f2" text-anchor="middle">128</text>

    <rect x="270" y="95" width="70" height="70" rx="8" fill="#edcc61"/>
    <text x="305" y="140" font-family="sans-serif" font-weight="bold" font-size="24" fill="#f9f6f2" text-anchor="middle">256</text>

    <!-- Row 3 Golden 2048 -->
    <rect x="15" y="175" width="155" height="145" rx="12" fill="#edc22e"/>
    <text x="92" y="260" font-family="sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle">2048</text>
  </g>
  <text x="400" y="420" font-family="sans-serif" font-weight="800" font-size="20" fill="#0d3b66" text-anchor="middle" letter-spacing="2">2048 MERGE ODYSSEY</text>
</svg>