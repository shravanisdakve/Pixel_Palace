<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="felt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f18"/>
      <stop offset="50%" stop-color="#08382c"/>
      <stop offset="100%" stop-color="#021410"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <filter id="neon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Emerald Felt Table Background -->
  <rect width="800" height="450" fill="url(#felt-bg)"/>
  
  <!-- Table Arch Line -->
  <path d="M 50 400 A 350 200 0 0 1 750 400" fill="none" stroke="rgba(0, 255, 255, 0.2)" stroke-width="4" stroke-dasharray="10, 10"/>

  <!-- Playing Cards (Ace of Spades & King of Diamonds - 21!) -->
  <!-- Card 1: Ace of Spades -->
  <g transform="translate(290, 80) rotate(-10)">
    <rect x="0" y="0" width="140" height="200" rx="10" fill="#ffffff" stroke="#00ffff" stroke-width="3" filter="url(#neon-shadow)"/>
    <text x="15" y="35" font-family="sans-serif" font-weight="900" font-size="24" fill="#0f0f1e">A</text>
    <text x="15" y="55" font-family="sans-serif" font-size="20" fill="#0f0f1e">♠</text>
    <text x="70" y="125" font-family="sans-serif" font-size="60" fill="#0f0f1e" text-anchor="middle">♠</text>
  </g>

  <!-- Card 2: King of Hearts -->
  <g transform="translate(370, 95) rotate(12)">
    <rect x="0" y="0" width="140" height="200" rx="10" fill="#ffffff" stroke="#ff00ff" stroke-width="3" filter="url(#neon-shadow)"/>
    <text x="15" y="35" font-family="sans-serif" font-weight="900" font-size="24" fill="#ff0055">K</text>
    <text x="15" y="55" font-family="sans-serif" font-size="20" fill="#ff0055">♥</text>
    <text x="70" y="125" font-family="sans-serif" font-size="60" fill="#ff0055" text-anchor="middle">♥</text>
  </g>

  <!-- Casino Chips -->
  <circle cx="230" cy="280" r="35" fill="#ff0055" stroke="#ffffff" stroke-width="4" stroke-dasharray="12, 6" filter="url(#neon-shadow)"/>
  <circle cx="230" cy="280" r="22" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="230" y="287" font-family="sans-serif" font-weight="bold" font-size="16" fill="#ffffff" text-anchor="middle">100</text>

  <circle cx="570" cy="290" r="35" fill="#00ffff" stroke="#ffffff" stroke-width="4" stroke-dasharray="12, 6" filter="url(#neon-shadow)"/>
  <circle cx="570" cy="290" r="22" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="570" y="297" font-family="sans-serif" font-weight="bold" font-size="16" fill="#0f0f1e" text-anchor="middle">500</text>

  <!-- 21 Banner -->
  <rect x="330" y="310" width="140" height="45" rx="22" fill="url(#gold-grad)" filter="url(#neon-shadow)"/>
  <text x="400" y="340" font-family="sans-serif" font-weight="900" font-size="24" fill="#000000" text-anchor="middle">BLACKJACK 21</text>

  <!-- Title Badge -->
  <rect x="230" y="375" width="340" height="45" rx="22" fill="rgba(10, 15, 25, 0.95)" stroke="#00ffff" stroke-width="2"/>
  <text x="400" y="404" font-family="sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">BLACKJACK ROYALE</text>
</svg>
