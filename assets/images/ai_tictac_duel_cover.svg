<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a15"/>
      <stop offset="100%" stop-color="#0a1a08"/>
    </linearGradient>
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ai-bg)"/>

  <!-- Glowing Grid Lines (green tinted for AI feel) -->
  <g stroke="#00ff88" stroke-width="6" stroke-linecap="round" filter="url(#ai-glow)">
    <line x1="320" y1="70" x2="320" y2="330"/>
    <line x1="480" y1="70" x2="480" y2="330"/>
    <line x1="180" y1="150" x2="620" y2="150"/>
    <line x1="180" y1="250" x2="620" y2="250"/>
  </g>

  <!-- Human O marks (orange) -->
  <!-- Top Left O -->
  <circle cx="250" cy="110" r="28" fill="none" stroke="#ff8800" stroke-width="10" filter="url(#ai-glow)"/>
  <!-- Bottom Left O -->
  <circle cx="250" cy="290" r="28" fill="none" stroke="#ff8800" stroke-width="10" filter="url(#ai-glow)"/>

  <!-- AI X marks (bright green) -->
  <!-- Top Right X -->
  <g stroke="#00ff88" stroke-width="12" stroke-linecap="round" filter="url(#ai-glow)">
    <line x1="520" y1="85" x2="580" y2="130"/>
    <line x1="580" y1="85" x2="520" y2="130"/>
  </g>
  <!-- Center X (AI winning move) -->
  <g stroke="#00ff88" stroke-width="14" stroke-linecap="round" filter="url(#ai-glow)">
    <line x1="370" y1="170" x2="430" y2="230"/>
    <line x1="430" y1="170" x2="370" y2="230"/>
  </g>
  <!-- Bottom Right X -->
  <g stroke="#00ff88" stroke-width="12" stroke-linecap="round" filter="url(#ai-glow)">
    <line x1="520" y1="265" x2="580" y2="310"/>
    <line x1="580" y1="265" x2="520" y2="310"/>
  </g>

  <!-- AI winning strike line (diagonal) -->
  <line x1="490" y1="75" x2="510" y2="320" stroke="#00ffcc" stroke-width="6" stroke-linecap="round" stroke-dasharray="12,6" filter="url(#ai-glow)"/>

  <!-- AI Robot icon (top-right corner) -->
  <g transform="translate(640, 50)" filter="url(#ai-glow)">
    <!-- Head -->
    <rect x="10" y="10" width="50" height="40" rx="8" fill="#001a0a" stroke="#00ff88" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="25" cy="30" r="7" fill="#00ff88"/>
    <circle cx="45" cy="30" r="7" fill="#00ff88"/>
    <circle cx="25" cy="30" r="3" fill="#ffffff"/>
    <circle cx="45" cy="30" r="3" fill="#ffffff"/>
    <!-- Antenna -->
    <line x1="35" y1="10" x2="35" y2="0" stroke="#00ff88" stroke-width="3"/>
    <circle cx="35" cy="0" r="4" fill="#00ff88"/>
    <!-- Body -->
    <rect x="15" y="52" width="40" height="28" rx="5" fill="#001a0a" stroke="#00ff88" stroke-width="2"/>
    <text x="35" y="72" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle">AI</text>
  </g>

  <!-- VS text -->
  <text x="400" y="385" font-family="monospace" font-weight="bold" font-size="18" fill="#00ff88" text-anchor="middle" filter="url(#ai-glow)" opacity="0.7">HUMAN vs</text>

  <!-- Title Badge -->
  <rect x="210" y="390" width="380" height="46" rx="23" fill="rgba(0, 10, 5, 0.95)" stroke="#00ff88" stroke-width="2" filter="url(#ai-glow)"/>
  <text x="400" y="420" font-family="sans-serif" font-weight="900" font-size="16" fill="#00ff88" text-anchor="middle" letter-spacing="2">AI TIC-TAC DUEL</text>
</svg>
