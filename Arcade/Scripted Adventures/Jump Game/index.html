<!DOCTYPE html>
<html lang="en" onkeydown="myFunction(event)">
<head>
    <meta charset="UTF-8">
    <title>Jump Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../../index.html" class="back-link">&lt; Back to Pixel Palace</a>
    <div class="game-wrapper">
        <h2>Jump Game</h2>
        <p id="co">Press space to jump</p>
        <div class="game">
            <div id="character"></div>
            <div id="block"></div>
            <div id="block2"></div>
        </div>
        <p>Score: <span id="scoreSpan"></span></p>
    </div>
    <script src="script.js"></script>
    <div id="custom-alert-container" class="custom-alert-container" style="display: none;">
      <div class="custom-alert-popup">
          <p id="custom-alert-message"></p>
          <button id="custom-alert-btn">Play Again</button>
      </div>
    </div>
</body>
</html>
