<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Score Keeper</title>
  <link rel="stylesheet" href="Score_keeper.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
 </head>
 <body>
  <a href="../../index.html" class="back-link">&lt; Back to Pixel Palace</a>
  <div class="sk">
   <h1>SCOREKEEPER</h1>
   <div class="players">
    <h2>
     <span class="p1scrdisp"> 0 </span>-<span class="p2scrdisp"> 0 </span>
    </h2>
   </div>
   <div class="label">
    <label for="lt">Maximum Score</label>
   </div>
   <div class="score" id="lt">
    <select name="" class="limit">
     <option value="5" selected>5</option>
     <option value="2">2</option>
     <option value="3">3</option>
     <option value="4">4</option>
     <option value="0">0</option>
     <option value="6">6</option>
     <option value="7">7</option>
     <option value="8">8</option>
     <option value="9">9</option>
     <option value="10">10</option>
     <option value="11">11</option>
    </select>
   </div>
   <div class="buttons">
    <button class="p1button">+1 to Player-1</button>
    <button class="p2button">+1 to Player-2</button>
    <button class="reset">Reset</button>
   </div>
  </div>
  <script src="Score_keeper.js"></script>
  <div id="custom-alert-container" class="custom-alert-container" style="display: none;">
    <div class="custom-alert-popup">
        <p id="custom-alert-message"></p>
        <button id="custom-alert-btn">OK</button>
    </div>
  </div>
 </body>
</html>
