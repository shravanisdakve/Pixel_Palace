<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 Puzzle Game</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-wrapper">
    <a href="../../index.html" class="back-link">&lt; Back to Pixel Palace</a>
    <h1>15 PUZZLE</h1>
    <div id='fifteen'></div> <!--element "fifteen" in which the game will take place-->
</div>
<script>
var setup={
     puzzle_fifteen:{
        diff:300, // number of movements of the slots for shuffling pictures
        size:[512,640], // element size "fifteen" in pixels only
        grid:[3,4], // the number of squares in the height and width of the picture
        fill:true, // Stretching the area with the game to fit the element is recommended for fullscreen
        number:true, // Slot sequence number (changed to true for clarity)
        gamePad:true,
        art:{
            url:"example.html_files/art.jpg", // path to the picture (you can use any format of supported browsers, gif-animation of svg)
            ratio:false // enlarge the picture in height or width
        },
        // optional elements
        time:0.1, // block move animation time
        style:"border-radius:8px; border: 2px solid #ccc; box-shadow: 0 2px 5px rgba(0,0,0,0.1); background-color: #f8f8f8; color: #333;", // style for puzzle square
        keyBoard:true // Control using the keys on the keyboard
     }
}
</script>
<script src="fifteen_puzzle.js"></script> <!--path to file engine-->
</body>
</html>
