<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Match - Pixel Palace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #1a4a4a 0%, #0a2a2a 100%);
            border: 2px solid #00bfbf;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #7fdbca;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
            margin-top: 5px;
        }

        .game-board {
            background: linear-gradient(135deg, #1a3a4a 0%, #0a1a2a 100%);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            text-align: center;
        }

        .difficulty-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .difficulty-btn {
            background: linear-gradient(135deg, #1a4a4a 0%, #0a2a2a 100%);
            color: #00ffff;
            border: 2px solid #00bfbf;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 12px;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .difficulty-btn:hover {
            border-color: #00ffff;
        }

        .pattern-display {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00bfbf;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }

        .instruction {
            background: rgba(255, 255, 0, 0.1);
            border: 2px solid #ffff00;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #ffff00;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.2);
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .color-btn {
            aspect-ratio: 1;
            border: 3px solid;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.1s ease;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            background-color: transparent;
        }

        .color-btn:hover:not(.disabled) {
            transform: scale(1.05);
            z-index: 10;
        }

        .color-btn:active:not(.disabled) {
            transform: scale(0.95);
        }

        .color-btn.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Color Themes */
        .color-btn.red {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border-color: #ff0000;
            color: #fff;
        }

        .color-btn.blue {
            background: linear-gradient(135deg, #4444ff, #0000cc);
            border-color: #0000ff;
            color: #fff;
        }

        .color-btn.green {
            background: linear-gradient(135deg, #44ff44, #00cc00);
            border-color: #00ff00;
            color: #000;
        }

        .color-btn.yellow {
            background: linear-gradient(135deg, #ffff44, #cccc00);
            border-color: #ffff00;
            color: #000;
        }

        .color-btn.purple {
            background: linear-gradient(135deg, #aa44ff, #7700cc);
            border-color: #aa00ff;
            color: #fff;
        }

        .color-btn.cyan {
            background: linear-gradient(135deg, #44ffff, #00cccc);
            border-color: #00ffff;
            color: #000;
        }

        .color-btn.orange {
            background: linear-gradient(135deg, #ff8844, #cc5500);
            border-color: #ff6600;
            color: #fff;
        }

        .color-btn.pink {
            background: linear-gradient(135deg, #ff44aa, #cc0077);
            border-color: #ff0088;
            color: #fff;
        }

        .color-btn.white {
            background: linear-gradient(135deg, #ffffff, #cccccc);
            border-color: #ffffff;
            color: #000;
        }

        .color-btn.active {
            filter: brightness(1.5);
            box-shadow: 0 0 30px currentColor, inset 0 0 20px rgba(255, 255, 255, 0.8);
            transform: scale(1.1);
        }

        .status-message {
            font-size: 18px;
            margin: 15px 0;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 25px;
        }

        .status-message.correct {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .status-message.wrong {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            animation: shake 0.5s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            grid-column: 1 / 3;
        }

        .btn-start:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn-start:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #555;
            color: #888;
            box-shadow: none;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: linear-gradient(135deg, #1a3a4a 0%, #0a1a2a 100%);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 42px;
            color: #ffff00;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
        }

        .result-stat {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .result-item {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00bfbf;
            padding: 15px;
            border-radius: 10px;
        }

        .result-item-label {
            font-size: 12px;
            color: #7fdbca;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .result-item-value {
            font-size: 28px;
            color: #00ffff;
            font-weight: bold;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 30px;
            font-weight: bold;
            animation: particle-float 1s ease-out forwards;
        }

        @keyframes particle-float {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0);
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .game-board {
                padding: 20px;
            }

            .game-grid {
                gap: 10px;
            }

            .color-btn {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="goBack()">← BACK</button>

    <div class="game-container">
        <div class="header">
            <h1>🎨 PATTERN MATCH</h1>
            <p class="subtitle">Watch, Remember, Repeat</p>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">ROUND</div>
                <div class="stat-value" id="round">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">BEST</div>
                <div class="stat-value" id="bestScore">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">STATUS</div>
                <div class="stat-value" id="statusIcon">READY</div>
            </div>
        </div>

        <div class="game-board">
            <div class="difficulty-selector">
                <button class="difficulty-btn active" onclick="setDifficulty('easy')">EASY (4)</button>
                <button class="difficulty-btn" onclick="setDifficulty('medium')">MEDIUM (6)</button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')">HARD (9)</button>
            </div>

            <div class="instruction" id="instruction">Press Start to Play</div>

            <div class="game-grid" id="gameGrid">
                <!-- Color Buttons Injected JS -->
            </div>

            <div class="status-message" id="statusMessage"></div>

            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="startGame()">START GAME</button>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <h2>GAME OVER</h2>
            <div class="instruction" style="background:transparent; border:none; color:#fff;" id="overReason">Wrong
                Sequence!</div>
            <div class="result-stat">
                <div class="result-item">
                    <div class="result-item-label">Final Score</div>
                    <div class="result-item-value" id="finalScore">0</div>
                </div>
                <div class="result-item">
                    <div class="result-item-label">Rounds Survived</div>
                    <div class="result-item-value" id="finalRound">0</div>
                </div>
            </div>
            <button class="btn btn-start" onclick="resetGameUI()">TRY AGAIN</button>
        </div>
    </div>

    <script>
        const colors = [
            { id: 'red', freq: 261.63 },    // C4
            { id: 'blue', freq: 329.63 },   // E4
            { id: 'green', freq: 392.00 },  // G4
            { id: 'yellow', freq: 523.25 }, // C5
            { id: 'purple', freq: 440.00 }, // A4
            { id: 'cyan', freq: 493.88 },   // B4
            { id: 'orange', freq: 293.66 }, // D4
            { id: 'pink', freq: 349.23 },   // F4
            { id: 'white', freq: 587.33 }   // D5
        ];

        // State
        let gameState = {
            difficulty: 'easy',
            sequence: [],
            playerIndex: 0,
            score: 0,
            round: 1,
            bestScore: localStorage.getItem('patternBest') || 0,
            isPlayingSequence: false,
            gameActive: false,
            gridSize: 4
        };

        // DOM
        const gameGrid = document.getElementById('gameGrid');
        const scoreEl = document.getElementById('score');
        const roundEl = document.getElementById('round');
        const bestScoreEl = document.getElementById('bestScore');
        const statusIcon = document.getElementById('statusIcon');
        const statusMessage = document.getElementById('statusMessage');
        const instruction = document.getElementById('instruction');
        const startBtn = document.getElementById('startBtn');
        const modal = document.getElementById('resultModal');

        // Audio
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playTone(freq, type = 'sine', duration = 0.3) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioContext.currentTime);

            gain.gain.setValueAtTime(0.1, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + duration);

            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }

        function playErrorSound() {
            playTone(150, 'sawtooth', 0.5);
            playTone(100, 'sawtooth', 0.5);
        }

        // Init
        function init() {
            bestScoreEl.textContent = gameState.bestScore;
            setDifficulty('easy');
        }

        function setDifficulty(level) {
            if (gameState.gameActive) return;

            gameState.difficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (level === 'easy') gameState.gridSize = 4;
            else if (level === 'medium') gameState.gridSize = 6;
            else gameState.gridSize = 9;

            renderGrid();
        }

        function renderGrid() {
            gameGrid.innerHTML = '';
            gameGrid.style.gridTemplateColumns = gameState.gridSize === 4 ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)';

            const activeColors = colors.slice(0, gameState.gridSize);

            activeColors.forEach(color => {
                const btn = document.createElement('div');
                btn.className = `color-btn ${color.id} disabled`;
                btn.id = `btn-${color.id}`;
                btn.onclick = () => handleInput(color.id);
                gameGrid.appendChild(btn);
            });
        }

        function startGame() {
            if (gameState.gameActive) return;

            gameState.gameActive = true;
            gameState.score = 0;
            gameState.round = 1;
            gameState.sequence = [];

            updateStats();
            startBtn.disabled = true;
            statusIcon.textContent = "WATCH";
            statusIcon.style.color = "#ffff00";
            instruction.textContent = "Watch the sequence closely...";

            // Enable board visually but logic handles input
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('disabled'));

            nextRound();
        }

        function nextRound() {
            gameState.playerIndex = 0;
            statusIcon.textContent = "WATCH";
            statusIcon.style.color = "#ffff00";
            instruction.textContent = `Round ${gameState.round}: Watch!`;

            // Add new step
            const activeColors = colors.slice(0, gameState.gridSize);
            const randomColor = activeColors[Math.floor(Math.random() * activeColors.length)];
            gameState.sequence.push(randomColor.id);

            // Play sequence
            gameState.isPlayingSequence = true;
            disableInput(true);

            let i = 0;
            const interval = setInterval(() => {
                const colorId = gameState.sequence[i];
                activateButton(colorId);
                i++;

                if (i >= gameState.sequence.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        gameState.isPlayingSequence = false;
                        disableInput(false);
                        statusIcon.textContent = "PLAY";
                        statusIcon.style.color = "#00ff00";
                        instruction.textContent = "Repeat the sequence!";
                    }, 500); // Small pause after last flash
                }
            }, 800); // Speed of sequence
        }

        function activateButton(colorId) {
            const btn = document.getElementById(`btn-${colorId}`);
            btn.classList.add('active');

            const colorData = colors.find(c => c.id === colorId);
            if (colorData) playTone(colorData.freq);

            setTimeout(() => {
                btn.classList.remove('active');
            }, 400);
        }

        function handleInput(colorId) {
            if (!gameState.gameActive || gameState.isPlayingSequence) return;

            // Visual feedback
            activateButton(colorId);

            // Logic
            const correctId = gameState.sequence[gameState.playerIndex];

            if (colorId === correctId) {
                // Correct
                gameState.playerIndex++;

                if (gameState.playerIndex === gameState.sequence.length) {
                    // Round Complete
                    gameState.score += (gameState.round * 10);
                    gameState.round++;
                    statusMessage.textContent = "CORRECT!";
                    statusMessage.className = "status-message correct";
                    updateStats();

                    // FX
                    createParticles(document.getElementById(`btn-${colorId}`));

                    setTimeout(() => {
                        statusMessage.textContent = "";
                        nextRound();
                    }, 1000);
                }
            } else {
                // Game Over
                gameOver();
            }
        }

        function gameOver() {
            gameState.gameActive = false;
            playErrorSound();
            statusIcon.textContent = "GAME OVER";
            statusIcon.style.color = "#ff0000";

            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('patternBest', gameState.bestScore);
            }

            document.getElementById('finalScore').textContent = gameState.score;
            document.getElementById('finalRound').textContent = gameState.round - 1;
            modal.classList.add('show');
        }

        function resetGameUI() {
            modal.classList.remove('show');
            statusIcon.textContent = "READY";
            statusIcon.style.color = "#fff";
            instruction.textContent = "Press Start to Play";
            statusMessage.textContent = "";
            startBtn.disabled = false;
            disableInput(true);
            updateStats();
        }

        function updateStats() {
            scoreEl.textContent = gameState.score;
            roundEl.textContent = gameState.round;
            bestScoreEl.textContent = gameState.bestScore;
        }

        function disableInput(disabled) {
            const btns = document.querySelectorAll('.color-btn');
            btns.forEach(btn => {
                if (disabled) btn.classList.add('disabled');
                else btn.classList.remove('disabled');
            });
        }

        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = '✨';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.color = '#fff';
                particle.style.fontSize = '20px';

                const angle = Math.random() * Math.PI * 2;
                const dist = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist;

                particle.style.transform = `translate(${tx}px, ${ty}px)`;
                particle.style.transition = 'all 0.6s ease-out';
                particle.style.opacity = '1';

                document.body.appendChild(particle);

                requestAnimationFrame(() => {
                    particle.style.opacity = '0';
                });

                setTimeout(() => particle.remove(), 600);
            }
        }

        function goBack() {
            window.location.href = '../../education.html';
        }

        // Init
        init();

    </script>
</body>

</html>
