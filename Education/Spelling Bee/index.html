<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Bee - Pixel Palace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            z-index: 100;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #1a4a4a 0%, #0a2a2a 100%);
            border: 2px solid #00bfbf;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #7fdbca;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #00ffff;
            margin-top: 5px;
        }

        .game-board {
            background: linear-gradient(135deg, #1a3a4a 0%, #0a1a2a 100%);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .word-display {
            font-size: 32px;
            color: #ffff00;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speaker-btn {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .speaker-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .input-group {
            margin: 20px 0;
        }

        .input-field {
            width: 100%;
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .input-field::placeholder {
            color: rgba(0, 255, 255, 0.5);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-submit {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            grid-column: 1 / 3;
        }

        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn-skip {
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            color: #fff;
        }

        .btn-skip:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(156, 39, 176, 0.5);
        }

        .feedback {
            font-size: 20px;
            margin: 15px 0;
            font-weight: bold;
            min-height: 30px;
        }

        .feedback.correct {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .feedback.wrong {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
        }

        .difficulty-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .difficulty-btn {
            background: linear-gradient(135deg, #1a4a4a 0%, #0a2a2a 100%);
            color: #00ffff;
            border: 2px solid #00bfbf;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            border-color: #00ffff;
        }

        .difficulty-btn:hover {
            border-color: #00ffff;
        }

        .definition-box {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00bfbf;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            font-size: 14px;
            color: #b0e0e6;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }

            .game-board {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="goBack()">← BACK</button>

    <div class="game-container">
        <div class="header">
            <h1>🐝 SPELLING BEE</h1>
            <p class="subtitle">Listen & Spell Correctly</p>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">CORRECT</div>
                <div class="stat-value" id="correct">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">TOTAL</div>
                <div class="stat-value" id="total">0</div>
            </div>
        </div>

        <div class="game-board">
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" onclick="setDifficulty('easy')">EASY</button>
                <button class="difficulty-btn" onclick="setDifficulty('medium')">MEDIUM</button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')">HARD</button>
            </div>

            <button class="speaker-btn" onclick="playWord()">🔊 LISTEN</button>

            <div class="word-display" id="wordDisplay">Ready?</div>

            <div class="definition-box" id="definitionBox">
                Listen to the word and type it correctly
            </div>

            <div class="input-group">
                <input type="text" class="input-field" id="inputField" placeholder="Type the word here..."
                    autocomplete="off">
            </div>

            <div class="feedback" id="feedback"></div>

            <div class="controls">
                <button class="btn btn-submit" onclick="checkSpelling()">SUBMIT</button>
                <button class="btn btn-skip" onclick="nextWord()">SKIP</button>
            </div>
        </div>
    </div>

    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        const words = {
            easy: [
                { word: 'apple', definition: 'A red or green fruit' },
                { word: 'book', definition: 'Something you read' },
                { word: 'cat', definition: 'A furry pet animal' },
                { word: 'dog', definition: 'Man\'s best friend' },
                { word: 'fish', definition: 'Lives in water' },
                { word: 'happy', definition: 'Feeling joyful' },
                { word: 'house', definition: 'Where you live' },
                { word: 'moon', definition: 'Shines at night' }
            ],
            medium: [
                { word: 'elephant', definition: 'A large gray animal' },
                { word: 'beautiful', definition: 'Very pretty or attractive' },
                { word: 'dinosaur', definition: 'Extinct prehistoric animal' },
                { word: 'library', definition: 'Place with many books' },
                { word: 'adventure', definition: 'Exciting journey or experience' },
                { word: 'calendar', definition: 'Shows days and months' },
                { word: 'volcano', definition: 'Mountain that erupts' },
                { word: 'butterfly', definition: 'Colorful flying insect' }
            ],
            hard: [
                { word: 'pneumonia', definition: 'Lung disease' },
                { word: 'accomplish', definition: 'To successfully complete' },
                { word: 'extraordinary', definition: 'Very unusual or remarkable' },
                { word: 'conscience', definition: 'Inner sense of right and wrong' },
                { word: 'surveillance', definition: 'Close observation' },
                { word: 'bureaucracy', definition: 'System of government offices' },
                { word: 'entrepreneur', definition: 'Business founder' },
                { word: 'conscientious', definition: 'Very careful and thorough' }
            ]
        };

        let gameState = {
            currentWord: null,
            difficulty: 'easy',
            score: 0,
            correct: 0,
            total: 0,
            wordList: []
        };

        function init() {
            gameState.wordList = [...words.easy];
            loadNextWord();
        }

        function setDifficulty(level) {
            gameState.difficulty = level;
            gameState.wordList = [...words[level]];
            gameState.score = 0;
            gameState.correct = 0;
            gameState.total = 0;
            updateStats();
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadNextWord();
        }

        function loadNextWord() {
            if (gameState.wordList.length === 0) {
                // Determine source for reload based on current difficulty
                gameState.wordList = [...words[gameState.difficulty]];
            }
            const randomIndex = Math.floor(Math.random() * gameState.wordList.length);
            gameState.currentWord = gameState.wordList[randomIndex];
            gameState.wordList.splice(randomIndex, 1);

            document.getElementById('wordDisplay').textContent = '🎵';
            document.getElementById('definitionBox').textContent = gameState.currentWord.definition;
            document.getElementById('inputField').value = '';
            document.getElementById('feedback').textContent = '';
            document.getElementById('inputField').focus();

            // Auto play
            // speakText(gameState.currentWord.word); // Optional: autoplay
        }

        function playWord() {
            speakText(gameState.currentWord.word);
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 0.8;
                utterance.pitch = 1.0;
                speechSynthesis.speak(utterance);
            } else {
                alert("Text-to-speech not supported in this browser.");
            }
        }

        function checkSpelling() {
            const userInput = document.getElementById('inputField').value.toLowerCase().trim();
            const correct = userInput === gameState.currentWord.word.toLowerCase();

            gameState.total++;

            if (correct) {
                document.getElementById('feedback').className = 'feedback correct';
                document.getElementById('feedback').textContent = '✓ CORRECT!';
                gameState.correct++;
                gameState.score += 10;
                playSuccessSound();
                setTimeout(loadNextWord, 1500);
            } else {
                document.getElementById('feedback').className = 'feedback wrong';
                document.getElementById('feedback').textContent = `✗ WRONG! It's "${gameState.currentWord.word}"`;
                playErrorSound();
                setTimeout(loadNextWord, 2000);
            }

            updateStats();
        }

        function nextWord() {
            gameState.total++;
            loadNextWord();
            playErrorSound(); // Feedback for skipping
            updateStats();
        }

        function updateStats() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('correct').textContent = gameState.correct;
            document.getElementById('total').textContent = gameState.total;
        }

        function playSuccessSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.frequency.setValueAtTime(600, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1000, audioContext.currentTime + 0.1);

            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            osc.start();
            osc.stop(audioContext.currentTime + 0.5);
        }

        function playErrorSound() {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.type = 'sawtooth';
            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.frequency.setValueAtTime(300, audioContext.currentTime);
            osc.frequency.linearRampToValueAtTime(100, audioContext.currentTime + 0.3);

            gain.gain.setValueAtTime(0.2, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

            osc.start();
            osc.stop(audioContext.currentTime + 0.3);
        }

        function goBack() {
            window.location.href = '../../education.html';
        }

        // Initialize
        init();

        // Enter key support
        document.getElementById('inputField').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkSpelling();
            }
        });
    </script>
</body>

</html>
