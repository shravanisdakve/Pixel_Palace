<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Builder - Pixel Palace</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }

        .game-container {
            width: 100%;
            max-width: 700px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #00ffff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 18px;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #1a4a4a 0%, #0a2a2a 100%);
            border: 2px solid #00bfbf;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .stat-label {
            font-size: 12px;
            color: #7fdbca;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00ffff;
        }

        .game-board {
            background: linear-gradient(135deg, #1a3a4a 0%, #0a1a2a 100%);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .hint-container {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00bfbf;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .hint-label {
            font-size: 12px;
            color: #7fdbca;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .hint-text {
            font-size: 18px;
            color: #00ffff;
            font-style: italic;
        }

        .word-slots {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00bfbf;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            min-height: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .slot {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(0, 191, 191, 0.2) 100%);
            border: 2px dashed #00bfbf;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #00ffff;
            font-weight: bold;
            cursor: grab;
            transition: all 0.3s ease;
            position: relative;
        }

        .slot:hover {
            border-color: #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.3) 0%, rgba(0, 191, 191, 0.3) 100%);
        }

        .slot.filled {
            border-style: solid;
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .slot.filled:hover {
            cursor: grabbing;
            transform: scale(1.1);
        }

        .slot.correct {
            background: linear-gradient(135deg, #00ff00 0%, #00cc00 100%);
            border-color: #00ff00;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            animation: pulse 0.6s ease;
        }

        .slot.wrong {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            border-color: #ff0000;
            color: #fff;
            animation: shake 0.5s ease;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .letters-pool {
            background: rgba(0, 20, 40, 0.8);
            border: 2px solid #00bfbf;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 70px;
        }

        .letter {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #00bfbf 0%, #0099cc 100%);
            color: #000;
            border: 2px solid #00ffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            cursor: grab;
            transition: all 0.3s ease;
            user-select: none;
        }

        .letter:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .letter:active {
            cursor: grabbing;
            transform: scale(0.95);
        }

        .letter.used {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
            background: #555;
            border-color: #777;
        }

        .letter.dragging {
            opacity: 0.5;
            transform: scale(1.2);
        }

        .difficulty-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .difficulty-btn {
            background: linear-gradient(135deg, #1a4a4a 0%, #0a2a2a 100%);
            color: #00ffff;
            border: 2px solid #00bfbf;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 12px;
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .difficulty-btn:hover {
            border-color: #00ffff;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-submit {
            background: linear-gradient(135deg, #00ffff 0%, #00bfbf 100%);
            color: #000;
            grid-column: 1 / 3;
        }

        .btn-submit:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn-hint {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: #fff;
        }

        .btn-hint:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 152, 0, 0.5);
        }

        .btn-skip {
            background: linear-gradient(135deg, #9c27b0 0%, #7b1fa2 100%);
            color: #fff;
        }

        .btn-skip:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(156, 39, 176, 0.5);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: #555;
            color: #888;
            box-shadow: none;
        }

        .status-message {
            text-align: center;
            font-size: 18px;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 25px;
            font-weight: bold;
        }

        .status-message.success {
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .status-message.error {
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            animation: shake 0.5s ease;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: linear-gradient(135deg, #1a3a4a 0%, #0a1a2a 100%);
            border: 3px solid #00ffff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 42px;
            color: #ffff00;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
        }

        .result-stat {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .result-item {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00bfbf;
            padding: 15px;
            border-radius: 10px;
        }

        .result-item-label {
            font-size: 12px;
            color: #7fdbca;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .result-item-value {
            font-size: 28px;
            color: #00ffff;
            font-weight: bold;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 30px;
            font-weight: bold;
            animation: particle-float 1s ease-out forwards;
        }

        @keyframes particle-float {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0);
            }
        }
    </style>
</head>

<body>
    <button class="back-btn" onclick="goBack()">← BACK</button>

    <div class="game-container">
        <div class="header">
            <h1>📝 WORD BUILDER</h1>
            <p class="subtitle">Drag Letters to Build Words</p>
        </div>

        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-label">SCORE</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">STREAK</div>
                <div class="stat-value" id="streak">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">LEVEL</div>
                <div class="stat-value" id="level">1</div>
            </div>
        </div>

        <div class="game-board">
            <div class="difficulty-selector">
                <button class="difficulty-btn active" onclick="setDifficulty('easy')">EASY</button>
                <button class="difficulty-btn" onclick="setDifficulty('medium')">MEDIUM</button>
                <button class="difficulty-btn" onclick="setDifficulty('hard')">HARD</button>
            </div>

            <div class="hint-container">
                <div class="hint-label">HINT</div>
                <div class="hint-text" id="hintText"></div>
            </div>

            <div class="word-slots" id="wordSlots"></div>

            <div class="letters-pool" id="lettersPool"></div>

            <div class="status-message" id="statusMessage"></div>

            <div class="controls">
                <button class="btn btn-submit" onclick="checkAnswer()">SUBMIT ANSWER</button>
                <button class="btn btn-hint" onclick="useHint()">GET HINT (-50 PTS)</button>
                <button class="btn btn-skip" onclick="skipLevel()">SKIP (-100 PTS)</button>
            </div>
        </div>
    </div>

    <!-- Results/Level Up Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2 id="modalTitle">LEVEL COMPLETED!</h2>
            <div class="result-stat" id="modalStats">
                <!-- Injected via JS -->
            </div>
            <button class="btn btn-submit" id="modalBtn" onclick="nextLevel()">CONTINUE</button>
        </div>
    </div>

    <script>
        // Data
        const wordData = {
            easy: [
                { word: "CAT", hint: "A common feline pet that meows." },
                { word: "DOG", hint: "Man's best friend." },
                { word: "SUN", hint: "It shines in the sky during the day." },
                { word: "BAT", hint: "A flying mammal or something used in baseball." },
                { word: "RED", hint: "The color of an apple or strawberry." },
                { word: "SKY", hint: "It's blue and above us." },
                { word: "PEN", hint: "Used for writing with ink." },
                { word: "BOX", hint: "A square container." }
            ],
            medium: [
                { word: "APPLE", hint: "A red or green fruit that keeps the doctor away." },
                { word: "TIGER", hint: "A large orange cat with black stripes." },
                { word: "RIVER", hint: "A large natural stream of water." },
                { word: "PEACE", hint: "Freedom from disturbance; tranquility." },
                { word: "HAPPY", hint: "Feeling or showing pleasure." },
                { word: "BEACH", hint: "Sandy shore by the ocean." },
                { word: "MUSIC", hint: "Vocal or instrumental sounds." },
                { word: "EARTH", hint: " The planet we live on." }
            ],
            hard: [
                { word: "JUNGLE", hint: "A dense forest in a tropical region." },
                { word: "PUZZLE", hint: "A game involving piecing things together." },
                { word: "PLANET", hint: "A celestial body moving in an elliptical orbit." },
                { word: "GARDEN", hint: "A piece of ground for growing flowers or fruit." },
                { word: "BUTTER", hint: "A yellow fat food made from milk." },
                { word: "WINDOW", hint: "An opening in a wall to let in light." },
                { word: "WINTER", hint: "The coldest season of the year." },
                { word: "DOCTOR", hint: "A person you visit when you are sick." }
            ]
        };

        // State
        let gameState = {
            difficulty: 'easy',
            currentWordObj: null,
            score: 0,
            streak: 0,
            level: 1,
            slotsState: [], // Array to track what letter is in what slot
            hintUsed: false
        };

        // Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // DOM
        const scoreEl = document.getElementById('score');
        const streakEl = document.getElementById('streak');
        const levelEl = document.getElementById('level');
        const hintTextEl = document.getElementById('hintText');
        const wordSlotsEl = document.getElementById('wordSlots');
        const lettersPoolEl = document.getElementById('lettersPool');
        const statusMessageEl = document.getElementById('statusMessage');
        const modal = document.getElementById('modal');

        // Functions
        function initGame() {
            loadLevel();
            updateStats();
        }

        function setDifficulty(level) {
            gameState.difficulty = level;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            gameState.level = 1;
            gameState.score = 0;
            gameState.streak = 0;
            updateStats();
            loadLevel();
        }

        function loadLevel() {
            // Pick random word
            const pool = wordData[gameState.difficulty];
            gameState.currentWordObj = pool[Math.floor(Math.random() * pool.length)];

            // Setup UI
            hintTextEl.textContent = gameState.currentWordObj.hint;
            gameState.hintUsed = false;

            createBoard(gameState.currentWordObj.word);
        }

        function createBoard(word) {
            wordSlotsEl.innerHTML = '';
            lettersPoolEl.innerHTML = '';
            gameState.slotsState = new Array(word.length).fill(null);

            // Create Slots
            for (let i = 0; i < word.length; i++) {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.index = i;
                slot.ondragover = allowDrop;
                slot.ondrop = drop;
                slot.onclick = removeLetterFromSlot;
                wordSlotsEl.appendChild(slot);
            }

            // Create Letters (Shuffle)
            const letters = word.split('').sort(() => Math.random() - 0.5);
            letters.forEach((char, index) => {
                const letter = document.createElement('div');
                letter.className = 'letter';
                letter.textContent = char;
                letter.draggable = true;
                letter.id = `letter-${index}`;
                letter.ondragstart = drag;
                lettersPoolEl.appendChild(letter);
            });

            statusMessageEl.textContent = "";
            statusMessageEl.className = "status-message";
        }

        // Drag & Drop Handling
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
            ev.target.classList.add('dragging');
            playSound('drag');
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const letterEl = document.getElementById(data);
            const slot = ev.target.closest('.slot'); // Ensure we drop on the slot

            letterEl.classList.remove('dragging');

            if (slot && !slot.classList.contains('filled')) {
                // Determine source: Pool or another slot?
                const parent = letterEl.parentElement;

                // Clear old slot state if moving from slot to slot
                if (parent.classList.contains('slot')) {
                    parent.classList.remove('filled');
                    gameState.slotsState[parent.dataset.index] = null;
                }

                // Place in new slot
                slot.appendChild(letterEl);
                slot.classList.add('filled');
                gameState.slotsState[slot.dataset.index] = letterEl.textContent;

                playSound('drop');
            } else if (ev.target.id === "lettersPool" || ev.target.closest('#lettersPool')) {
                // Return to pool logic
                const pool = document.getElementById('lettersPool');
                pool.appendChild(letterEl);

                // Clear old slot
                const parent = letterEl.parentElement; // Incorrect if we already appended, but logic holds if we track before append.
                // Actually standard behavior handles reparenting. We just need to clear previous slot state if it WAS in a slot.
                // We need to know previous parent. But letterEl.parentElement is now pool.
                // Simpler: iterate slots and update state based on content.
                updateSlotsState();
                playSound('drop');
            }

            // Cleanup: update all slots state just in case
            updateSlotsState();
        }

        function removeLetterFromSlot(ev) {
            // Click to return to pool
            if (ev.target.classList.contains('slot') && ev.target.classList.contains('filled')) {
                const letter = ev.target.querySelector('.letter');
                if (letter) {
                    lettersPoolEl.appendChild(letter);
                    ev.target.classList.remove('filled');
                    updateSlotsState();
                    playSound('drop');
                }
            } else if (ev.target.classList.contains('letter') && ev.target.parentElement.classList.contains('slot')) {
                const letter = ev.target;
                const slot = letter.parentElement;
                lettersPoolEl.appendChild(letter);
                slot.classList.remove('filled');
                updateSlotsState();
                playSound('drop');
            }
        }

        function updateSlotsState() {
            const slots = document.querySelectorAll('.slot');
            slots.forEach((slot, i) => {
                const letter = slot.querySelector('.letter');
                if (letter) {
                    gameState.slotsState[i] = letter.textContent;
                    slot.classList.add('filled');
                } else {
                    gameState.slotsState[i] = null;
                    slot.classList.remove('filled');
                }
            });
        }

        function playSound(type) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            osc.connect(gain);
            gain.connect(audioContext.destination);
            const now = audioContext.currentTime;

            if (type === 'drag') {
                osc.frequency.setValueAtTime(300, now);
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'drop') {
                osc.frequency.setValueAtTime(600, now);
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.frequency.setValueAtTime(200, now);
                osc.type = 'sawtooth';
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        function checkAnswer() {
            const currentWord = gameState.currentWordObj.word;
            const formedWord = gameState.slotsState.join('');

            if (formedWord === currentWord) {
                // Correct
                playSound('success');
                statusMessageEl.textContent = "CORRECT! +100 PTS";
                statusMessageEl.className = "status-message success";

                // Animation on correct slots
                document.querySelectorAll('.slot').forEach(s => s.classList.add('correct'));

                gameState.score += 100 + (gameState.streak * 10);
                gameState.streak++;
                gameState.level++;
                updateStats();

                createParticles(window.innerWidth / 2, window.innerHeight / 2, "AWESOME!");

                setTimeout(() => {
                    loadLevel();
                }, 1500);

            } else {
                // Wrong
                playSound('wrong');
                statusMessageEl.textContent = "TRY AGAIN!";
                statusMessageEl.className = "status-message error";

                document.querySelectorAll('.slot').forEach((s, idx) => {
                    // Provide visual feedback on specific wrong letters? 
                    // Or just shake whole board. Let's shake filled slots.
                    if (s.classList.contains('filled')) s.classList.add('wrong');
                });

                gameState.streak = 0;
                updateStats();

                setTimeout(() => {
                    document.querySelectorAll('.slot').forEach(s => s.classList.remove('wrong'));
                    statusMessageEl.textContent = "";
                }, 1000);
            }
        }

        function useHint() {
            if (gameState.score >= 50 && !gameState.hintUsed) {
                gameState.score -= 50;
                gameState.hintUsed = true;
                updateStats();

                // Fill the first empty or wrong slot with correct letter
                const targetWord = gameState.currentWordObj.word;
                const slots = document.querySelectorAll('.slot');

                for (let i = 0; i < targetWord.length; i++) {
                    // If slot is empty or has wrong letter
                    if (!gameState.slotsState[i] || gameState.slotsState[i] !== targetWord[i]) {

                        // Find the correct letter in pool or other slots
                        // Logic: Find the DOM element for the correct letter.
                        // We need to look through the pool and slots.

                        const correctChar = targetWord[i];

                        // Helper to find letter element
                        let letterEl = Array.from(document.querySelectorAll('.letter')).find(el =>
                            el.textContent === correctChar &&
                            // Ensure we don't pick one that is already correctly placed in another slot
                            !(el.parentElement.classList.contains('slot') &&
                                el.parentElement.dataset.index == i) // Wait, simplified check: just find one not already locked text.
                            // Actually, simpler visualized: Just flash the correct letter for that position.
                        );

                        // To physically move it is complex because we might disrupt user. 
                        // Let's just highlight the slot and show the letter text temporarily as a ghost hint?
                        // Or just fill it. Let's just Flash a message for now or reveal 1 letter.

                        statusMessageEl.textContent = `HINT: The letter at pos ${i + 1} is '${correctChar}'`;
                        statusMessageEl.className = "status-message";
                        break;
                    }
                }

            } else if (gameState.hintUsed) {
                statusMessageEl.textContent = "Hint already used!";
                statusMessageEl.className = "status-message error";
            } else {
                statusMessageEl.textContent = "Not enough points!";
                statusMessageEl.className = "status-message error";
            }
            setTimeout(() => {
                if (statusMessageEl.className.includes('error')) statusMessageEl.textContent = "";
            }, 1000);
        }

        function skipLevel() {
            if (gameState.score >= 100) {
                gameState.score -= 100;
                loadLevel();
                updateStats();
            } else {
                statusMessageEl.textContent = "Need 100 pts to skip!";
                statusMessageEl.className = "status-message error";
                setTimeout(() => statusMessageEl.textContent = "", 1000);
            }
        }

        function updateStats() {
            scoreEl.textContent = gameState.score;
            streakEl.textContent = gameState.streak;
            levelEl.textContent = gameState.level;
        }

        function createParticles(x, y, text) {
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = text ? (i === 0 ? text : '★') : '★';
                particle.style.left = (x + (Math.random() * 100 - 50)) + 'px';
                particle.style.top = (y + (Math.random() * 100 - 50)) + 'px';
                particle.style.color = '#00ffff';
                particle.style.fontSize = Math.random() * 20 + 10 + 'px';
                particle.style.textShadow = '0 0 10px rgba(0, 255, 255, 0.5)';
                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 1000);
            }
        }

        function goBack() {
            window.location.href = '../../education.html';
        }

        // Initialize
        initGame();

    </script>
</body>
